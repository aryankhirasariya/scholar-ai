<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholar AI — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0A0A0B;
    --bg-2:     #111114;
    --bg-3:     #18181C;
    --bg-4:     #1F1F25;
    --border:   rgba(255,255,255,0.06);
    --border-md:rgba(255,255,255,0.10);
    --gold:     #C9A15C;
    --gold-dim: rgba(201,161,92,0.12);
    --sage:     #6B8F76;
    --text-1:   #F0EBE0;
    --text-2:   #A09890;
    --text-3:   #5A5650;
    --red:      #C05050;
    --font-d:   'Fraunces', serif;
    --font-b:   'Inter', sans-serif;
    --font-m:   'IBM Plex Mono', monospace;
    --r:        8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-b);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 40px;
  }
  .brand-mark { font-family: var(--font-d); font-size: 32px; color: var(--gold); }
  .brand-name { font-family: var(--font-d); font-size: 22px; font-weight: 600; }

  .card {
    width: 100%; max-width: 400px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 32px;
  }

  .card-title {
    font-family: var(--font-d); font-size: 22px;
    font-weight: 600; margin-bottom: 6px;
  }
  .card-sub {
    font-size: 13px; color: var(--text-3);
    margin-bottom: 28px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-2); margin-bottom: 6px;
    font-family: var(--font-m);
  }
  .field input {
    width: 100%; padding: 11px 13px;
    background: var(--bg-3); border: 1px solid var(--border-md);
    border-radius: var(--r); color: var(--text-1);
    font-family: var(--font-b); font-size: 13.5px;
    outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--gold); }
  .field input::placeholder { color: var(--text-3); }

  .submit-btn {
    width: 100%; padding: 12px;
    background: var(--gold); color: #0A0A0B;
    border: none; border-radius: var(--r);
    font-family: var(--font-b); font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
    transition: background 0.15s;
  }
  .submit-btn:hover { background: #DDB870; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    font-family: var(--font-m); font-size: 12px;
    color: var(--red); background: rgba(192,80,80,0.08);
    border: 1px solid rgba(192,80,80,0.2);
    border-radius: var(--r); padding: 10px 12px;
    margin-bottom: 16px; display: none;
  }

  .divider {
    text-align: center; font-size: 12px; color: var(--text-3);
    margin: 20px 0; position: relative;
  }
  .divider::before, .divider::after {
    content: ""; position: absolute; top: 50%;
    width: 42%; height: 1px; background: var(--border);
  }
  .divider::before { left: 0; }
  .divider::after  { right: 0; }

  .switch-link {
    text-align: center; font-size: 13px; color: var(--text-3);
  }
  .switch-link a { color: var(--gold); text-decoration: none; }
  .switch-link a:hover { text-decoration: underline; }

  .privacy-note {
    margin-top: 28px; text-align: center;
    font-family: var(--font-m); font-size: 11px; color: var(--text-3);
  }
</style>
</head>
<body>

  <div class="brand">
    <span class="brand-mark">§</span>
    <span class="brand-name">Scholar AI</span>
  </div>

  <div class="card">
    <p class="card-title">Welcome back</p>
    <p class="card-sub">Sign in to access your research library</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="submit-btn" id="loginBtn">Sign in</button>

    <div class="divider">or</div>

    <div class="switch-link">
      Don't have an account? <a href="/app/signup.html">Create one</a>
    </div>
  </div>

  <div class="privacy-note">● Running locally — nothing leaves this machine</div>

<script>
  // if already logged in, go straight to app
  if (localStorage.getItem("scholar_token")) {
    window.location.href = "/app/index.html";
  }

  async function login() {
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");
    const btn      = document.getElementById("loginBtn");

    errorMsg.style.display = "none";

    if (!email || !password) {
      errorMsg.textContent = "Please fill in all fields.";
      errorMsg.style.display = "block";
      return;
    }

    btn.disabled    = true;
    btn.textContent = "Signing in…";

    try {
      const res  = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.detail || "Login failed.";
        errorMsg.style.display = "block";
        return;
      }

      localStorage.setItem("scholar_token", data.access_token);
      localStorage.setItem("scholar_name",  data.name);
      localStorage.setItem("scholar_email", data.email);

      window.location.href = "/app/index.html";

    } catch (err) {
      errorMsg.textContent = "Could not connect to server.";
      errorMsg.style.display = "block";
    } finally {
      btn.disabled    = false;
      btn.textContent = "Sign in";
    }
  }

  document.getElementById("loginBtn").addEventListener("click", login);

  // Enter key to submit
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") login();
  });
</script>
</body>
</html>
